name: Starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-07
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-09-07
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - run: npm run handoff
      - run: npm run build:demo
      - run: npm run build:library
      - run: git diff --exit-code -- demo "START HERE.html"
